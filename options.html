<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地语言包 - 翻译喵</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body data-i18n-page-title="modelsTitle">
    <aside class="settings-sidebar">
      <button id="back-to-extension" class="back-link" type="button" data-i18n="backToWebpage">← 返回网页</button>
      <div class="sidebar-brand">
        <img src="icons/icon-128.png" width="36" height="36" alt="" />
        <strong data-i18n="brandName">翻译喵</strong>
      </div>
      <span class="sidebar-label" data-i18n="settingsLabel">设置</span>
      <nav aria-label="设置目录">
        <button class="nav-item is-active" type="button" data-panel="models">
          <span aria-hidden="true">文/A</span><span data-i18n="modelsTitle">本地语言包</span>
        </button>
        <button class="nav-item" type="button" data-panel="appearance">
          <span aria-hidden="true">◐</span><span data-i18n="appearance">外观</span>
        </button>
        <button class="nav-item" type="button" data-panel="advanced">
          <span aria-hidden="true">⚙</span><span data-i18n="advanced">高级设置</span>
        </button>
      </nav>
    </aside>

    <main class="settings-shell">
      <section id="models-panel" class="settings-panel">
      <section class="info-card">
        <span class="ready-shield" aria-hidden="true">✓</span>
        <div>
          <strong id="installed-summary" data-i18n="checkingPacks">正在检查语言包…</strong>
          <p data-i18n="localReady">本地翻译已就绪</p>
        </div>
      </section>

      <p id="settings-notice" class="settings-notice" role="status" hidden></p>

      <section class="models-section">
        <div class="section-heading">
          <div>
            <h2 data-i18n="choosePack">选择语言包</h2>
            <p id="summary-text" data-i18n="onDemand">仅在需要时下载，不会自动占用空间</p>
          </div>
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="model-search" type="search" placeholder="搜索语言" data-i18n-placeholder="searchLanguage" />
          </label>
        </div>

        <div class="model-filters" role="group" aria-label="筛选语言包">
          <button class="model-filter is-active" type="button" data-filter="all"><span data-i18n="all">全部</span></button>
          <button class="model-filter" type="button" data-filter="available"><span data-i18n="installed">已安装</span> <span id="installed-count">0</span></button>
          <button class="model-filter" type="button" data-filter="downloadable"><span data-i18n="downloadable">可下载</span> <span id="downloadable-count">0</span></button>
        </div>
        <div id="model-list" class="model-list" aria-live="polite"></div>
        <button id="show-more-models" class="show-more-models" type="button">
          <span data-i18n="showMore">显示更多语言</span>
        </button>
      </section>

      <footer class="model-note">
        <span aria-hidden="true">i</span>
        <span data-i18n="modelNote">语言包由 Chrome 提供和管理。目前扩展只能下载，暂不支持直接卸载。</span>
      </footer>
      </section>

      <section id="appearance-panel" class="settings-panel" hidden>
        <header class="settings-header simple-header">
          <div class="appearance-icon" aria-hidden="true">◐</div>
          <div>
            <h1 data-i18n="appearance">外观</h1>
            <p data-i18n="appearanceSubtitle">调整插件的显示方式</p>
          </div>
        </header>
        <section class="appearance-card">
          <div>
            <h2 data-i18n="languageSettings">语言设置</h2>
            <p data-i18n="languageSettingsDesc">选择插件界面的显示语言</p>
          </div>
          <label class="interface-language-field">
            <span data-i18n="displayLanguage">显示语言</span>
            <select id="interface-language"></select>
          </label>
        </section>
        <section class="appearance-card">
          <div>
            <h2 data-i18n="colorTheme">界面配色</h2>
            <p data-i18n="colorThemeDesc">选择插件的强调色</p>
          </div>
          <div id="theme-picker" class="theme-picker" role="radiogroup" data-i18n-aria-label="colorTheme">
            <button class="theme-option is-pink" type="button" data-theme-value="pink" role="radio" aria-checked="true" data-i18n-aria-label="themePink"><span aria-hidden="true">✓</span></button>
            <button class="theme-option is-green" type="button" data-theme-value="green" role="radio" aria-checked="false" data-i18n-aria-label="themeGreen"><span aria-hidden="true">✓</span></button>
            <button class="theme-option is-purple" type="button" data-theme-value="purple" role="radio" aria-checked="false" data-i18n-aria-label="themePurple"><span aria-hidden="true">✓</span></button>
            <button class="theme-option is-blue" type="button" data-theme-value="blue" role="radio" aria-checked="false" data-i18n-aria-label="themeBlue"><span aria-hidden="true">✓</span></button>
            <button class="theme-option is-yellow" type="button" data-theme-value="yellow" role="radio" aria-checked="false" data-i18n-aria-label="themeYellow"><span aria-hidden="true">✓</span></button>
          </div>
        </section>
      </section>

      <section id="advanced-panel" class="settings-panel" hidden>
        <header class="settings-header simple-header">
          <div class="appearance-icon" aria-hidden="true">⚙</div>
          <div>
            <h1 data-i18n="advanced">高级设置</h1>
            <p data-i18n="advancedSubtitle">管理翻译缓存与本地数据</p>
          </div>
        </header>
        <section class="appearance-card advanced-card">
          <div>
            <h2 data-i18n="cache">翻译缓存</h2>
          </div>
          <div class="advanced-actions">
            <div class="cache-actions-row">
              <label class="settings-switch">
                <span data-i18n="enableCache">启用缓存</span>
                <input id="settings-cache-enabled" type="checkbox" checked />
                <span class="switch-track" aria-hidden="true"></span>
              </label>
              <button id="settings-clear-cache" class="danger-button" type="button" data-i18n="clearCache">清空翻译缓存</button>
            </div>
            <span id="cache-action-status" class="cache-action-status" role="status"></span>
          </div>
        </section>
        <section class="site-rules-card">
          <div class="site-rules-heading">
            <div>
              <h2 data-i18n="alwaysTranslateSites">总是翻译的网站</h2>
              <p data-i18n="alwaysTranslateSitesDesc">这些网站会在打开时自动翻译，名单仅保存在本机</p>
            </div>
            <span id="always-translate-sites-count" class="site-rules-count"></span>
          </div>
          <div id="always-translate-sites-list" class="site-rules-list" role="list" aria-live="polite"></div>
          <p id="always-translate-sites-empty" class="site-rules-empty" data-i18n="noAlwaysTranslateSites">
            暂无总是翻译的网站
          </p>
          <span id="site-rules-action-status" class="site-rules-action-status" role="status"></span>
        </section>
      </section>
    </main>

    <template id="model-row-template">
      <article class="model-row">
        <div class="language-info">
          <span class="language-symbol"></span>
          <div>
            <strong class="language-name"></strong>
            <span class="language-pair"></span>
          </div>
        </div>
        <div class="model-status">
          <span class="status-indicator"></span>
          <span class="status-label">检查中</span>
        </div>
        <button class="row-action" type="button" disabled>检查中</button>
        <progress class="download-progress" max="100" value="0"></progress>
      </article>
    </template>

    <script src="languages.js"></script>
    <script src="i18n.js"></script>
    <script src="theme.js"></script>
    <script src="options.js"></script>
  </body>
</html>
