      <text class="tiny muted" x="110" y="262">9 / 100</text>
      <rect x="149.5" y="173" width="142.5" height="100" rx="9" fill="#fafafb" stroke="#e5e6e9"/>
      <text class="body muted" x="159" y="194">译文会显示在这里</text>
      <rect x="258" y="239" width="26" height="26" rx="6" fill="#fff" stroke="#dedfe3"/>
      <rect x="267" y="247" width="8" height="9" rx="1" fill="none" stroke="#56595f" stroke-width="1.3"/>
      <path d="M265 254h-1a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2" fill="none" stroke="#56595f" stroke-width="1.3"/>

