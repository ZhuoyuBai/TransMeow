  <rect x="30" y="590" width="664" height="48" rx="10" fill="#fff"/>
  <text class="body" x="46" y="611"><tspan font-weight="700">交互约定：</tspan>输入框最多 100 个字符；粘贴或停止输入后自动翻译；输出语言跟随“目标语言”；</text>
  <text class="body" x="46" y="628">复制按钮只复制译文；缺少语言包时不发起翻译，并提供“去下载”入口。</text>
