      <rect x="0" y="104" width="52" height="36" rx="8" fill="#f7f7f8" stroke="#ececf0"/>
      <text x="22" y="127" font-size="13" font-weight="750" fill="#4b4e54">A</text>
      <rect x="58" y="104" width="234" height="36" rx="8" fill="#ec4899"/>
      <text x="130" y="127" font-size="13" font-weight="750" fill="#fff">翻译当前页面</text>

      <text class="label strong" x="0" y="165">短文本翻译</text>
      <text class="tiny muted" x="215" y="165">粘贴后自动翻译</text>

      <rect x="0" y="173" width="142.5" height="100" rx="9" fill="#fff" stroke="#f3a8c9"/>
      <rect x="-2" y="171" width="146.5" height="104" rx="11" fill="none" stroke="#ec4899" stroke-opacity=".08" stroke-width="4"/>
      <text class="body" x="9" y="194">The best way to</text>
      <text class="body" x="9" y="211">predict the future is</text>
      <text class="body" x="9" y="228">to create it.</text>
      <text class="tiny muted" x="102" y="262">52 / 100</text>

      <rect x="149.5" y="173" width="142.5" height="100" rx="9" fill="#fafafb" stroke="#e5e6e9"/>
      <text class="body" x="159" y="194">预测未来最好的</text>
      <text class="body" x="159" y="211">方式，就是亲手</text>
      <text class="body" x="159" y="228">创造它。</text>
      <rect x="258" y="239" width="26" height="26" rx="6" fill="#fff" stroke="#dedfe3"/>
      <rect x="267" y="247" width="8" height="9" rx="1" fill="none" stroke="#56595f" stroke-width="1.3"/>
      <path d="M265 254h-1a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2" fill="none" stroke="#56595f" stroke-width="1.3"/>

      <text class="tiny" x="2" y="290" fill="#16803a">✓ 已翻译为简体中文</text>

      <text class="label strong" x="4" y="329">总是翻译该网站</text>
      <rect x="256" y="314" width="36" height="20" rx="10" fill="#d1d5db"/>
      <circle cx="266" cy="324" r="8" fill="#fff"/>
    </g>
  </g>

  <g transform="translate(374 100)">
    <rect width="320" height="468" fill="#fff" stroke="#e7e7ea" filter="url(#shadow)"/>
    <g transform="translate(14 14)">
      <rect width="32" height="32" rx="5" fill="#111214"/>
      <text x="5" y="14" font-size="10" font-weight="700" fill="#fff">中</text>
      <text x="17" y="26" font-size="13" font-weight="700" fill="#fff">A</text>
      <text class="title" x="40" y="14">翻译喵</text>
      <text class="small muted" x="40" y="28">免费的本地化翻译服务</text>
      <text x="267" y="23" font-size="18" fill="#74777d">⚙</text>

      <g transform="translate(0 44)">
        <rect width="122" height="48" rx="8" fill="#f7f7f8" stroke="#ececf0"/>
        <text class="lang" x="8" y="20">自动检测</text><text class="body muted" x="105" y="18">⌄</text>
        <text class="small muted" x="8" y="36">原文语言</text>
        <text x="133" y="28" font-size="16" fill="#9a9ca1">→</text>
        <rect x="156" width="136" height="48" rx="8" fill="#f7f7f8" stroke="#ececf0"/>
        <text class="lang" x="164" y="20">日语</text><text class="body muted" x="275" y="18">⌄</text>
        <text class="small muted" x="164" y="36">目标语言</text>
      </g>

      <rect x="0" y="104" width="52" height="36" rx="8" fill="#f7f7f8" stroke="#ececf0"/>
      <text x="22" y="127" font-size="13" font-weight="750" fill="#4b4e54">A</text>
      <rect x="58" y="104" width="234" height="36" rx="8" fill="#ec4899"/>
      <text x="130" y="127" font-size="13" font-weight="750" fill="#fff">翻译当前页面</text>

      <text class="label strong" x="0" y="165">短文本翻译</text>
