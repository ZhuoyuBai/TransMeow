<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #202124; }
      .muted { fill: #8a8d91; }
      .tiny { font-size: 9px; }
      .small { font-size: 10px; }
      .body { font-size: 11px; }
      .label { font-size: 12px; font-weight: 650; }
      .title { font-size: 14px; font-weight: 700; }
      .board-title { font-size: 20px; font-weight: 700; }
      .lang { font-size: 13px; font-weight: 650; }
      .strong { font-weight: 700; }
    </style>
  </defs>

  <rect width="760" height="660" fill="#f5f5f7"/>
  <text class="board-title" x="30" y="36">短文本翻译 · 弹窗原型</text>
  <text class="label muted" x="30" y="58">保持现有 320px 弹窗宽度；左为正常翻译状态，右为语言包缺失状态。</text>

  <text class="body strong" x="32" y="88" fill="#686b71">A. 正常翻译</text>
  <text class="body strong" x="376" y="88" fill="#686b71">B. 目标语言包未下载</text>

  <g transform="translate(30 100)">
    <rect width="320" height="468" fill="#fff" stroke="#e7e7ea" filter="url(#shadow)"/>
    <g transform="translate(14 14)">
      <rect width="32" height="32" rx="5" fill="#111214"/>
      <text x="5" y="14" font-size="10" font-weight="700" fill="#fff">中</text>
      <text x="17" y="26" font-size="13" font-weight="700" fill="#fff">A</text>
      <text class="title" x="40" y="14">翻译喵</text>
      <text class="small muted" x="40" y="28">免费的本地化翻译服务</text>
      <text x="267" y="23" font-size="18" fill="#74777d">⚙</text>

      <g transform="translate(0 44)">
        <rect width="122" height="48" rx="8" fill="#f7f7f8" stroke="#ececf0"/>
        <text class="lang" x="8" y="20">自动检测</text><text class="body muted" x="105" y="18">⌄</text>
        <text class="small muted" x="8" y="36">原文语言</text>
        <text x="133" y="28" font-size="16" fill="#9a9ca1">→</text>
        <rect x="156" width="136" height="48" rx="8" fill="#f7f7f8" stroke="#ececf0"/>
        <text class="lang" x="164" y="20">简体中文</text><text class="body muted" x="275" y="18">⌄</text>
        <text class="small muted" x="164" y="36">目标语言</text>
